<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Jargon — local multi-agent harness for your CLI coding agents">
  <title>Jargon</title>
  <defs>
    <style>
      .mark { font-family: Impact, "Anton", "Arial Narrow", sans-serif; font-weight: 900; fill: #F4F1EA; }
      .big  { font-size: 104px; }
      .sub  { font-family: "Tahoma", "DejaVu Sans", Geneva, sans-serif; font-size: 18px; letter-spacing: 9px; fill: #E76E00; }
      .tag  { font-family: "Tahoma", "DejaVu Sans", Geneva, sans-serif; font-size: 26px; fill: #F4F1EA; }
      .tag b{ fill: #E76E00; }
      .mono { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 15px; fill: #B9A9AC; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1207"/>
      <stop offset="1" stop-color="#0D0904"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Plate carrying the Jargon mark -->
  <g transform="translate(72, 88)">
    <rect x="0" y="0" width="236" height="224" rx="18" fill="#2E1D08"/>
    <rect x="0" y="0" width="236" height="224" rx="18" fill="none" stroke="#E76E00" stroke-width="6"/>
    <image x="18" y="18" width="200" height="200" xlink:href="data:image/png;base64,"/>
  </g>

  <!-- Wordmark -->
  <text class="mark big" x="348" y="212">JARGON</text>
  <text class="sub" x="352" y="264">MULTI-AGENT HARNESS</text>

  <!-- Value-prop column -->
  <g transform="translate(760, 150)">
    <text class="tag" x="0" y="0">A hive of <b>CLI</b> agents that</text>
    <text class="tag" x="0" y="40">message, route, and remember —</text>
    <text class="tag" x="0" y="80">run by a <b>GOD</b> orchestrator</text>
    <text class="tag" x="0" y="120">you talk to.</text>
    <text class="mono" x="0" y="180">$ npm run dev   ·   local-first   ·   open source</text>
  </g>
</svg>
